# SnapRAID config for the media server pool.
# Parity protects data/ (movies, tv) against losing any ONE disk.
# It does NOT protect downloads/incomplete (excluded below - churns
# constantly and is re-downloadable) and it is NOT a backup: a sync
# after an accidental delete makes the deletion permanent in parity too.

# Parity file - sized to the largest data disk. parity1 is 11T, same
# size as disk3 (the largest data disk), so it fits.
parity /mnt/parity1/snapraid.parity

# Content files: the file index + checksums. Keep multiple copies on
# different disks so losing one disk never loses the index itself.
content /var/snapraid/snapraid.content
content /mnt/disk1/snapraid.content
content /mnt/disk2/snapraid.content
content /mnt/disk3/snapraid.content

# Data disks - the REAL branches, not the /mnt/storage mergerfs pool.
# Labels (d1/d2/d3) are permanent once synced; keep them if a disk is
# ever replaced.
data d1 /mnt/disk1/
data d2 /mnt/disk2/
data d3 /mnt/disk3/

# Exclusions
exclude *.unrecoverable
exclude /lost+found/
exclude /data/incomplete/
exclude /data/downloads/
