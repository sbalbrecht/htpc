---
secrets:
  # These files must exist to enable VPN access
  vpn_user:
    # Contains VPN username
    file: /host/vpnuser.txt
  vpn_pass:
    # Contains VPN password
    file: /host/vpnpass.txt
  # These files must exist for Grafana alerting
  discord_webhook:
    # Contains Discord webhook URL for alerts
    file: /host/discord_webhook.txt
  healthchecks_url:
    # Contains healthchecks.io ping URL (dead-man's switch)
    file: /host/healthchecks_url.txt

services:
  radarr:
    image: lscr.io/linuxserver/radarr
    container_name: radarr
    restart: unless-stopped
    env_file: .env
    volumes:
      # Media
      - /mnt/storage/data:/data 
      # Config files, logs
      - /host/radarr:/config
    ports:
      # Web UI
      - 7878:7878/tcp

  sonarr:
    image: lscr.io/linuxserver/sonarr
    container_name: sonarr
    restart: unless-stopped
    env_file: .env
    volumes:
      # Media
      - /mnt/storage/data:/data
      # Config files, logs
      - /host/sonarr:/config
    ports:
      # Web UI
      - 8989:8989/tcp

  prowlarr:
    image: lscr.io/linuxserver/prowlarr
    container_name: prowlarr
    restart: unless-stopped
    env_file: .env
    volumes:
      # Config files, logs
      - /host/prowlarr:/config
    ports:
      # Web UI
      - 9696:9696/tcp

  requestrr:
    image: thomst08/requestrr
    container_name: requestrr
    restart: unless-stopped
    env_file: .env
    volumes:
      # Config files, logs
      - /host/requestrr:/root/config
    ports:
      # Web UI
      - 4545:4545/tcp

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd
    container_name: sabnzbd
    restart: unless-stopped
    # Use VPN network
    network_mode: container:qbittorrentvpn
    depends_on:
      - qbittorrentvpn
    env_file: .env
    volumes:
      # Config files, logs
      - /host/sabnzbd:/config
      # Downloads
      - /mnt/storage/data/:/data
    # Web UI port exposed in VPN container

  # VPN Configuration: https://github.com/binhex/documentation/blob/master/docker/faq/vpn.md
  qbittorrentvpn:
    image: binhex/arch-qbittorrentvpn
    container_name: qbittorrentvpn
    restart: unless-stopped
    env_file: .env
    # Required for iptables permissions
    cap_add:
      - NET_ADMIN
    secrets:
      - vpn_user
      - vpn_pass
    # Use secrets for VPN_USER, VPN_PASS environment variables
    entrypoint: [ '/bin/bash', '-c', 'export VPN_USER=$$(cat /var/run/secrets/vpn_user) ; export VPN_PASS=$$(cat /var/run/secrets/vpn_pass) ; source /usr/bin/init.sh' ]
    environment:
     - VPN_ENABLED=yes
     - VPN_PROV=airvpn
     - VPN_CLIENT=openvpn
     - ENABLE_PRIVOXY=no
     # All host IPs for home network in CIDR notation (see A4)
     - LAN_NETWORK=192.168.0.22/22
     # Web UI ports of containers routed through the VPN (see A24, A25)
     # Values: SABnzbd
     - VPN_INPUT_PORTS=8080
     # Web UI ports of containers on the LAN with which containers on the VPN need to communicate
     # (see A24, A27)
     - VPN_OUTPUT_PORTS=
     # Overridden because SABnzbd cannot be overridden from 8080 using environment variables
     - WEBUI_PORT=8090
    volumes:
      # Config files, logs
      - /host/qbittorrent:/config
      # Downloads
      - /mnt/storage/data:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - 6881:6881
      - 6881:6881/udp
      # qBittorrent Web UI
      - 8090:8090
      # Privoxy Web UI
      - 8118:8118
      # SABnzbd Web UI
      - 8091:8080

  plex:
    image: lscr.io/linuxserver/plex
    container_name: plex
    restart: unless-stopped
    # Host network mode makes remote availability easier to set up
    network_mode: host
    env_file: .env
    environment:
      - VERSION=docker
    volumes:
      # Config files, logs
      - /host/plex:/config
      # Media
      - /mnt/storage/data/media:/data/media
    devices:
      # Expose graphics hardware for hardware transcoding
      - /dev/dri:/dev/dri

  # Local DNS: resolves *.home.arpa to this server
  adguard:
    image: adguard/adguardhome
    container_name: adguard
    restart: unless-stopped
    ports:
      - 53:53/tcp
      - 53:53/udp
      - 3000:3000/tcp
    volumes:
      - ./adguard/work:/opt/adguardhome/work
      - ./adguard/conf:/opt/adguardhome/conf

  # Reverse proxy: <service>.home.arpa -> container
  caddy:
    image: caddy:2
    container_name: caddy
    restart: unless-stopped
    ports:
      - 80:80
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/data:/data
    extra_hosts:
      - host.docker.internal:host-gateway

  # Monitoring: metrics database. Data lives on the SSD (/host), not the
  # mergerfs pool, so it doesn't keep HDDs awake or churn snapraid parity.
  prometheus:
    # Pinned to the major version: updates within v3 apply automatically,
    # a major upgrade is done by hand (monitoring should be the last thing to break)
    image: prom/prometheus:v3
    container_name: prometheus
    restart: unless-stopped
    user: "1000:1000"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=365d
      # Safety net: drop oldest data first if it ever grows past this
      - --storage.tsdb.retention.size=20GB
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Time series data
      - /host/prometheus:/prometheus
    extra_hosts:
      - host.docker.internal:host-gateway

  # Monitoring: host CPU, memory, network, disk I/O, filesystem usage.
  # Host network/PID namespaces so it sees the real NICs and processes.
  node-exporter:
    image: prom/node-exporter
    container_name: node-exporter
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      # Picks up *.prom files written by scripts (e.g. snapraid-nightly.sh)
      - --collector.textfile.directory=/textfile
      # Skip docker bridges/veths - hundreds of useless series
      - --collector.netdev.device-exclude=^(veth.*|br-.*|docker0|lo)$$
    volumes:
      - /:/host:ro,rslave
      - /var/lib/node_exporter:/textfile:ro

  # Monitoring: SMART health of each disk. Needs raw device access.
  smartctl-exporter:
    # v0.15.0 returns HTTP 500 for these drives
    image: prometheuscommunity/smartctl-exporter:v0.14.0
    container_name: smartctl-exporter
    restart: unless-stopped
    privileged: true
    user: root

  # Monitoring: dashboards and alerts
  grafana:
    # Pinned to a minor version (no major-version tag is published): security
    # and bug-fix updates apply automatically, bump the version by hand
    image: grafana/grafana:13.2
    container_name: grafana
    restart: unless-stopped
    user: "1000:1000"
    secrets:
      - discord_webhook
      - healthchecks_url
    # Load alert destination URLs from secrets for the alerting provisioning files
    entrypoint: [ '/bin/bash', '-c', 'export DISCORD_WEBHOOK_URL=$$(cat /run/secrets/discord_webhook) ; export HEALTHCHECKS_URL=$$(cat /run/secrets/healthchecks_url) ; exec /run.sh' ]
    environment:
      - GF_SERVER_ROOT_URL=http://grafana.home.arpa
    volumes:
      # Dashboards, users, settings
      - /host/grafana:/var/lib/grafana
      # Auto-configures the Prometheus data source
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    # No ports: AdGuard already holds 3000, access via Caddy
