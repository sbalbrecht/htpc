apiVersion: 1

# Recreated on every start so it always has the fixed uid below (an
# existing data source's uid can't be changed in place).
deleteDatasources:
  - name: Prometheus
    orgId: 1

datasources:
  - name: Prometheus
    # Fixed ID so alert rules can reference it
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
