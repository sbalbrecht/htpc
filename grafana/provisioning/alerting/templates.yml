# Discord message format: one line per alert, red/orange for firing,
# green check for resolved.
apiVersion: 1

templates:
  - orgId: 1
    name: server
    template: |
      {{ define "server.title" }}{{ if gt (len .Alerts.Firing) 0 }}Server alert{{ else }}Resolved{{ end }}{{ end }}

      {{ define "server.message" }}
      {{- range .Alerts.Firing }}
      {{ if eq .Labels.severity "critical" }}🔴{{ else }}🟠{{ end }} **{{ .Labels.alertname }}**: {{ .Annotations.summary }}
      {{ .Annotations.description }}
      {{ end }}
      {{- range .Alerts.Resolved }}
      ✅ **{{ .Labels.alertname }}** resolved: {{ .Annotations.summary }}
      {{ end }}
      {{- end }}
