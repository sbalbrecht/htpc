# Where alerts are sent. The URLs come from secret files in /host (see
# docker-compose.yml) so they never end up in the repo.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: Discord
    receivers:
      - uid: discord
        type: discord
        settings:
          url: $DISCORD_WEBHOOK_URL
          title: '{{ template "server.title" . }}'
          message: '{{ template "server.message" . }}'

  # Dead-man's switch: the heartbeat alert pings this every ~5 minutes.
  # healthchecks.io alerts you when the pings stop.
  - orgId: 1
    name: Healthchecks
    receivers:
      - uid: healthchecks
        type: webhook
        disableResolveMessage: true
        settings:
          url: $HEALTHCHECKS_URL
          httpMethod: POST
          # Short body instead of Grafana's full alert JSON, which
          # healthchecks.io shows as the "Last Ping Body".
          payload:
            template: 'Grafana heartbeat OK'
