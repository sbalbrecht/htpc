# Where alerts are sent. The URLs come from secret files in /host (see
# docker-compose.yml) so they never end up in the repo.
apiVersion: 1

contactPoints:
  # Sent as a plain webhook rather than Grafana's Discord integration, which
  # always adds a link to grafana.home.arpa that only works on the LAN.
  - orgId: 1
    name: Discord
    receivers:
      - uid: discord-webhook
        type: webhook
        settings:
          url: $DISCORD_WEBHOOK_URL
          httpMethod: POST
          payload:
            template: '{{ coll.Dict "content" (tmpl.Exec "server.discord" .) | data.ToJSON }}'

  # Dead-man's switch: the heartbeat alert pings this every ~5 minutes.
  # healthchecks.io alerts you when the pings stop.
  - orgId: 1
    name: Healthchecks
    receivers:
      - uid: healthchecks
        type: webhook
        disableResolveMessage: true
        settings:
          url: $HEALTHCHECKS_URL
          httpMethod: POST
