# smartd config. Installed to /etc/smartd.conf (see HOST-SETUP.md).
# Schedule and reasoning: maintenance-notes.md, "SMART self-tests".
#
# -s format is T/MM/DD/d/HH: test type (S short, L long), month, day of
# month, day of week (1 = Monday), hour. Long tests run in the first three
# weeks on Mondays and Thursdays, one disk at a time, so each finishes
# before the Wednesday 11:00 maintenance reboot and the next 03:00 sync.

DEFAULT -a -d removable -n standby -m root -M exec /usr/share/smartmontools/smartd-runner

# disk1, Toshiba 8 TB: long test 1st Monday (~11h)
/dev/disk/by-id/ata-TOSHIBA_HDWR480_9390A0JYFR2H -s (S/../../6/06|L/../0[1-7]/1/05)
# disk2, Toshiba 8 TB: long test 1st Thursday (~11h)
/dev/disk/by-id/ata-TOSHIBA_HDWR480_9390A07VFR2H -s (S/../../6/06|L/../0[1-7]/4/05)
# disk3, HGST 12 TB SAS: long test 2nd Monday (~15-20h)
/dev/disk/by-id/scsi-35000cca2782e2428 -s (S/../../6/06|L/../(0[89]|1[0-4])/1/05)
# parity1, HGST 12 TB SAS: long test 2nd Thursday (~15-20h)
/dev/disk/by-id/scsi-35000cca26f1a3ac4 -s (S/../../6/06|L/../(0[89]|1[0-4])/4/05)
# OS SSD, Samsung 250 GB: long test 3rd Monday (minutes)
/dev/disk/by-id/ata-Samsung_SSD_860_EVO_250GB_S59WNZFN103865J -s (S/../../6/06|L/../(1[5-9]|2[01])/1/05)
